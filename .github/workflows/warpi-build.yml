# warpi-build.yml — build warpi artifacts on GitHub-hosted runners.
#
# Repository location: .github/workflows/warpi-build.yml
#
# ============================ VERIFICATION STATUS ============================
# Run evidence: run 35879868946 (commit 01ec580d) executed both jobs on
# GitHub-hosted runners.
#   - Linux x86_64: every step passed — release build, the Rust adapter tests,
#     packaging/package-warpi.sh, and artifact upload.
#   - Windows x86_64: checkout, pinned protoc + Chocolatey cmake, the Pi helper
#     build/tests, and the release warpi.exe build passed. Earlier runs saw the
#     Rust adapter tests fail deterministically on the cross-process Node fixture
#     (standalone/pi-helper/test/serve-fixture.ts) with provider_error
#     "Connection error." That scoping is now removed: on a real Windows host the
#     harness was handing Node.js 24 a `\\?\` verbatim entry path
#     (canonicalize()), which Node 24's module loader rejects with EISDIR, and the
#     helper's own test harness omitted the Windows OS variables the runtime
#     needs. With both fixed, every fixture suite passes on Windows (see
#     standalone/WINDOWS.md section 8). The original "Connection error." CI run
#     predates the helper-environment fix and has not been re-run; CI confirms.
#
# Test scoping (Windows): none. Every cross-process-fixture test runs on Windows.
# Their old failure was the harness passing Node.js 24 a `\\?\` verbatim entry
# path (canonicalize()), which its module loader rejects; tests/support/mod.rs now
# normalizes the path and the TS test harness supplies the Windows OS variables
# the runtime needs. There is deliberately no blanket `continue-on-error` and no
# `--no-fail-fast`.
#
# Artifact independence: in BOTH jobs the bundle assembly, provenance
# attestation, and artifact upload run BEFORE the adapter-test step, so a
# failing adapter test can never cost us the artifacts. On Windows the attest
# and upload steps also carry `if: always()`, so a FAILED installer build still
# yields the staged bundle zip (and still attests it). The test step stays last,
# so the job still ends red when any step fails.
#
# Local evidence for the commands this workflow mirrors lives in
# standalone/VALIDATION.md and standalone/evidence/.
# The first-ever run failed on Linux in the warp-proto-apis build script because
# `--no-install-recommends` skipped libprotobuf-dev (protobuf-compiler only
# Recommends it), so google/protobuf/descriptor.proto was missing; installing it
# and setting PROTOC_INCLUDE explicitly is now verified by run 35879868946.
# Still UNVERIFIED:
#   * the GUI build, installer install, and agent round trip on Windows (the
#     local validation host has no MSVC/Windows SDK; the release ABI is MSVC);
#   * packaging/package-warpi.sh's `npm ci --omit=dev --offline` path relies on
#     a warm npm cache (setup-node's cache); if that fails the script falls back
#     to copying the full node_modules, which no runner has exercised;
#   * the assembled Windows bundle/zip with the now-bundled Node runtime (the
#     fetch script itself was verified on Windows);
#   * the Windows Inno Setup installer built by the windows-x86_64 job: the
#     script now compiles under Inno Setup 6.7.1 (verified locally for the
#     warpi/dev/stable channels with the official ISCC under Wine) but the
#     produced installer has still never been run/installed on Windows;
#   * third-party action pinning/caching behaviour.
# Artifacts are accompanied by GitHub build-provenance attestations
# (actions/attest-build-provenance), which require `id-token: write` and
# `attestations: write` on each job. These attestations prove which workflow,
# commit, and runner produced the file; they are NOT code signing and the
# installers are not Authenticode-signed.
# ============================================================================

name: warpi build

on:
  workflow_dispatch:
  push:
    tags:
      - "warpi-v*"

permissions:
  contents: read

jobs:
  linux-x86_64:
    name: Linux x86_64
    runs-on: ubuntu-latest
    timeout-minutes: 180
    permissions:
      contents: read
      # Required by actions/attest-build-provenance: id-token mints the OIDC
      # token the attestation is signed with; attestations writes the result.
      id-token: write
      attestations: write
    env:
      # Embedded at compile time so tagged builds report their real version in
      # About and in the Windows installer; empty for branch/dispatch builds.
      GIT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      # Mirrors the prerequisites in standalone/BUILDING.md; verified by run
      # 35879868946 on ubuntu-latest.
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            protobuf-compiler libprotobuf-dev libasound2-dev cmake pkg-config build-essential

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: standalone/pi-helper/package-lock.json

      - name: Build and test the Pi helper
        working-directory: standalone/pi-helper
        run: |
          npm ci
          npm run build
          npm test

      - name: Build warpi (release)
        env:
          # prost-build turns this into `protoc -I <dir>`; libprotobuf-dev
          # installs the well-known types (google/protobuf/*.proto) here.
          PROTOC_INCLUDE: /usr/include
        run: cargo build --locked -p warp --bin warpi --features gui --release

      - name: Assemble and archive the Linux bundle
        run: |
          WARPI_BINARY="$PWD/target/release/warpi" bash packaging/package-warpi.sh
          tar -C dist -czf "$PWD/dist/warpi-linux-x86_64.tar.gz" warpi-linux-x86_64
          (cd dist && sha256sum warpi-linux-x86_64.tar.gz > warpi-linux-x86_64.tar.gz.sha256)
          ls -lh dist

      # Provenance, not signing: this proves the tarball was built by this
      # workflow at this commit on a GitHub-hosted runner. No Authenticode or
      # GPG signature exists for these artifacts.
      - name: Attest Linux artifact provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/warpi-linux-x86_64.tar.gz

      - name: Upload Linux artifact
        uses: actions/upload-artifact@v4
        with:
          name: warpi-linux-x86_64
          path: |
            dist/warpi-linux-x86_64.tar.gz
            dist/warpi-linux-x86_64.tar.gz.sha256
          if-no-files-found: error
          retention-days: 14

      # Runs last on purpose: the artifact above is already attested and
      # uploaded, so a failing adapter test turns the job red without costing us
      # the artifact. No blanket `continue-on-error` / `--no-fail-fast`.
      - name: Test the Rust adapter
        run: cargo test -p standalone_agent

  windows-x86_64:
    name: Windows x86_64
    runs-on: windows-latest
    timeout-minutes: 180
    permissions:
      contents: read
      id-token: write
      attestations: write
    env:
      GIT_RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || '' }}
    steps:
      - uses: actions/checkout@v4

      # Verified by run 35879868946: the pinned protoc release and Chocolatey
      # cmake install on windows-latest. cmake and MSVC ship with the runner but
      # are installed/invoked explicitly here.
      - name: Install build dependencies (protoc, cmake)
        shell: pwsh
        run: |
          choco install cmake -y --no-progress
          # Pin the official protoc release: it ships the well-known types
          # (include/google/protobuf/*.proto) that the warp-proto-apis build
          # script needs. Package-manager copies may omit them.
          $zip = "$env:RUNNER_TEMP\protoc.zip"
          $dir = "$env:RUNNER_TEMP\protoc"
          Invoke-WebRequest -Uri "https://github.com/protocolbuffers/protobuf/releases/download/v30.2/protoc-30.2-win64.zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath $dir -Force
          "PROTOC=$dir\bin\protoc.exe" | Out-File -FilePath $env:GITHUB_ENV -Append
          "PROTOC_INCLUDE=$dir\include" | Out-File -FilePath $env:GITHUB_ENV -Append
          & "$dir\bin\protoc.exe" --version
          cmake --version

      - name: Install Rust 1.92.0
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.92.0

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v4
        with:
          node-version: "22.19"
          cache: npm
          cache-dependency-path: standalone/pi-helper/package-lock.json

      - name: Build and test the Pi helper
        working-directory: standalone/pi-helper
        shell: pwsh
        run: |
          npm ci
          npm run build
          npm test

      - name: Build warpi (release)
        shell: pwsh
        env:
          # On a Windows host app/build.rs embeds an icon/version resource. Cargo
          # may not set CARGO_BIN_NAME for the build script, so name the warpi
          # channel explicitly: build.rs looks up
          # app/channels/<name>/icon/no-padding/icon.ico and WARP_APP_NAME sets
          # the FileDescription. Both directories exist for the warpi channel;
          # see standalone/WINDOWS.md.
          CARGO_BIN_NAME: warpi
          WARP_APP_NAME: Warpi
        run: cargo build --locked -p warp --bin warpi --features gui --release

      # UNVERIFIED: manual staging instead of packaging/package-warpi.sh, which
      # targets Linux (uname, bash, install).
      - name: Assemble the Windows bundle
        shell: pwsh
        run: |
          $root = "dist/warpi-windows-x86_64"
          $helper = "$root/standalone/pi-helper"
          New-Item -ItemType Directory -Force -Path $helper | Out-Null
          Copy-Item "target/release/warpi.exe" "$root/warpi.exe"
          # The GUI needs the checked-in Windows payload next to the executable
          # (conpty, DirectX shims, MSVC runtime); see standalone/WINDOWS.md.
          Copy-Item "app/assets/windows/x64/*" "$root/"
          Copy-Item "standalone/pi-helper/dist" "$helper/dist" -Recurse
          Copy-Item "standalone/pi-helper/package.json" "$helper/package.json"
          Copy-Item "standalone/pi-helper/package-lock.json" "$helper/package-lock.json"
          Copy-Item "standalone/*.md" "$root/standalone/" -Force
          Copy-Item "packaging/config.example.json" "$root/config.example.json"
          Copy-Item "LICENSE-AGPL","LICENSE-MIT","LICENSE-NOTES.md" "$root/"
          Push-Location $helper
          npm ci --omit=dev --no-audit --no-fund
          Pop-Location
          # Bundle the pinned Node.js runtime so a fresh install never depends on
          # a system `node` (see standalone/WINDOWS.md); the app prefers it over
          # PATH. The script verifies the official archive's SHA-256.
          ./script/windows/fetch-node-runtime.ps1 -Version 22.19.0 -Arch x64 -Dest "$root/standalone/node"
          Compress-Archive -Path "$root/*" -DestinationPath "dist/warpi-windows-x86_64.zip" -Force
          Get-Item "dist/warpi-windows-x86_64.zip" | Format-List Length

      # The script compiles under Inno Setup 6.7.1 (verified locally for the
      # warpi/dev/stable channels with the official ISCC under Wine); the result
      # has not yet been run/installed on Windows. It reuses the staged bundle as
      # the payload root, so the warpi.exe binary, its Windows assets, and the
      # private Pi helper are installed together (the helper resolves at
      # {app}\standalone\pi-helper\dist\main.js, next to the executable). The
      # setup executable is NOT Authenticode-signed; provenance is provided by
      # the attestation step below instead.
      - name: Build the Windows installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { throw "ISCC.exe not found at $iscc" }
          $stage = (Resolve-Path "dist/warpi-windows-x86_64").Path
          $version = if ($env:GIT_RELEASE_TAG) { $env:GIT_RELEASE_TAG -replace '^[^0-9]*', '' } else { "" }
          if (-not $version) { $version = "0.1.0" }
          & $iscc "script\windows\windows-installer.iss" `
            "/DReleaseChannel=warpi" `
            "/DMyAppExeName=warpi.exe" `
            "/DTargetProfileDir=$stage" `
            "/DMyAppName=Warpi" `
            "/DMyAppVersion=$version" `
            "/DArch=x64" `
            "/DOutputName=WarpiSetup"
          if (-not $?) { throw "Inno Setup failed to build the warpi installer" }
          Get-ChildItem "script\windows\Output" | Format-Table Name, Length

      # `if: always()` so a failed installer build still produces (and, when
      # present, attests) the staged bundle zip. The subject list may contain a
      # path that does not exist (the installer exe after an installer failure);
      # the bundle zip still matches, so the attestation is created for it and
      # the upload below still runs. The job stays red from the failed step.
      - name: Attest Windows artifact provenance
        if: always()
        uses: actions/attest-build-provenance@v2
        with:
          subject-path: |
            dist/warpi-windows-x86_64.zip
            script/windows/Output/WarpiSetup.exe

      - name: Upload Windows artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: warpi-windows-x86_64
          path: |
            dist/warpi-windows-x86_64.zip
            script/windows/Output/WarpiSetup.exe
          if-no-files-found: error
          retention-days: 14

      # Runs last on purpose: the bundle, installer, attestation, and upload
      # above have already completed, so a failing adapter test turns the job red
      # without costing us the artifacts. Every test runs on Windows — there is
      # no scoped ignore (the cross-process-fixture failure was fixed; see the
      # header) and no blanket `continue-on-error` / `--no-fail-fast`.
      - name: Test the Rust adapter
        shell: pwsh
        run: cargo test -p standalone_agent
